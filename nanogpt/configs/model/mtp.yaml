name: mtp
n_embd: 768
n_head: 6
n_component: 1
n_token: 4

gpt: &gpt
    _target_: nanogpt.models.gpt.GPT
    vocab_size: ${data.vocab_size}
    n_embd: ${model.n_embd}
    n_head: ${model.n_head}
    n_layer: 12
mt_head: &mt_head
    _target_: nanogpt.models.mtp_head.MultiTokenHead
    vocab_size: ${data.vocab_size}
    n_embd: ${model.n_embd}
    n_head: ${model.n_head}
    n_layer: 2
    n_component: ${model.n_component}
    n_token: ${model.n_token}
circuit: &circuit
    _target_: nanogpt.models.circuits.CircuitCP
    vocab_size: ${data.vocab_size}
    n_token: ${model.n_token}
    n_component: ${model.n_component}
model:
    _target_: nanogpt.models.mtp.MultiTokenLM
    gpt: *gpt
    mt_head: *mt_head
    circuit: *circuit
